#
# Layout dell'immagine SD. Gli offset non sono arbitrari:
#   - 8 KiB e' dove la BROM dell'F1C200s cerca l'header "eGON.BT0";
#   - la prima partizione parte a 2 MiB per lasciare spazio a SPL + U-Boot
#     (~400 KB oggi) senza doverla spostare al primo bump di U-Boot.

image boot.vfat {
	vfat {
		files = {
			"zImage",
			"suniv-f1c200s-lctech-pi.dtb"
		}
	}
	size = 16M
}

image sdcard.img {
	hdimage {}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 2040K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 2M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
